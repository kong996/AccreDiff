[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "accrediff"
version = "1.0.0"
description = "A coupled accretion-differentiation framework for terrestrial planet formation"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Zhihui Kong", email = "kongzh0508@163.com" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "planet formation",
    "core-mantle differentiation",
    "N-body simulation",
    "geochemistry"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "openpyxl"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "build",
    "twine"
]
examples = [
    "jupyter",
    "ipykernel",
    "ipywidgets",
    "tqdm",
    "seaborn"
]
video = [
    "opencv-python",
    "natsort"
]

[project.urls]
Homepage = "https://github.com/kong996/AccreDiff"
Repository = "https://github.com/kong996/AccreDiff"
Issues = "https://github.com/kong996/AccreDiff/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accrediff = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
